  <text x="102" y="56" fill="#64748b" font-family="monospace" font-size="10">Automated Understanding, Code Testing,</text>
  <text x="102" y="70" fill="#64748b" font-family="monospace" font-size="10">Optimization &amp; Reproduction</text>
  <text x="102" y="88" fill="#94a3b8" font-family="monospace" font-size="8">engineering repro &#x2192; improve &#x2192; deploy &#x2192; report</text>

  <!-- Craftsman pixel character (right side, buddy style) -->
  <g transform="translate(428,2) scale(0.88)">
    <!-- Hard hat (amber) -->
    <rect x="20" y="38" width="7" height="7" fill="#d97706"/>
